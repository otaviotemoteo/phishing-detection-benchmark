name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Read the required Python version
        id: python-version
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python-version.outputs.version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the dependencies the tests import
        # A strict subset of requirements.txt, with the pins read out of that
        # file so the two cannot drift. The tests use synthetic data and never
        # train a model, so PyTorch, XGBoost, CatBoost, MLflow and the notebook
        # stack are not needed here; installing them would add gigabytes and
        # several minutes to a job that finishes in seconds.
        run: |
          python -m pip install --upgrade pip
          python -m pip install $(grep -E '^(numpy|pandas|scipy|scikit-learn|imbalanced-learn|matplotlib|psutil|joblib|pytest|ruff)==' requirements.txt)

      - name: Lint
        run: ruff check src/ scripts/ tests/

      - name: Compile every module
        run: python -m compileall -q src/ scripts/ tests/

      - name: Tests
        run: pytest tests/ -v

      - name: Results are intact
        # The three metric tables are the numbers the dissertation cites. If a
        # commit changes one of them, this job says so.
        run: sha256sum -c results/CHECKSUMS.txt
